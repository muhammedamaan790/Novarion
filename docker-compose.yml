# Local mode (authoritative judging setup): `docker compose up` → http://localhost:8080
# Weights are host-mounted so promotions/rollbacks survive restarts (plan §10); build them with `make reproduce`.
services:
  backend:
    build: {context: ., dockerfile: docker/backend.Dockerfile}
    environment:
      NOVARION_RUN_MODE: local
      NOVARION_TRUST_PROXY: "1"  # requests arrive through our nginx, which sets X-Real-IP
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./registry:/app/registry:ro
    ports: ["${NOVARION_API_PORT:-8000}:8000"]   # NOVARION_API_PORT=8001 if 8000 is taken
  frontend:
    build: {context: ., dockerfile: docker/frontend.Dockerfile}
    depends_on:
      backend: {condition: service_healthy}
    ports: ["8080:80"]
