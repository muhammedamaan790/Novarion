# Single-container nginx for the Hugging Face Space: runs as an unprivileged user, so every writable path is in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  types { model/gltf-binary glb; }

  # The Space's edge proxy appends the client address to X-Forwarded-For; without recursion nginx takes that last
  # entry, which a client cannot forge (it can only prepend). That address is the rate-limit identity.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;

  server {
    listen 7860;
    root /app/web;
    gzip on;
    gzip_types application/json application/javascript text/css model/gltf-binary;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
      client_max_body_size 64k;
    }
    location / {
      try_files $uri /index.html;
    }
  }
}
